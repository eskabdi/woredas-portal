name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      # Route tree is generated by the TanStack Router Vite plugin during
      # build, not by tsc -- typecheck after building or new routes fail with
      # a stale-generated-tree error that has nothing to do with the change.
      - run: bun run build
      - run: npx tsc --noEmit
      - run: bun run test
      - run: bun run check:role-perms-drift
