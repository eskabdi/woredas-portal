name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned rather than @v2: a moved tag on a third-party action runs
      # arbitrary code in this job with no corresponding change in this repo
      # to bisect against (the tj-actions/changed-files compromise, Mar 2025,
      # was exactly this). Points at the current v2.2.0 release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned rather than "latest" -- a new Bun release changing install
          # resolution or test-runner defaults between two PRs' CI runs would
          # otherwise produce an intermittent failure with no corresponding
          # code change to bisect against.
          bun-version: "1.3.11"
      # --frozen-lockfile fails fast on a package.json/bun.lock mismatch
      # instead of silently re-resolving and installing versions nobody
      # reviewed.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Route tree is generated by the TanStack Router Vite plugin during
      # build, not by tsc -- typecheck after building or new routes fail with
      # a stale-generated-tree error that has nothing to do with the change.
      - run: bun run build
      - run: npx tsc --noEmit
      - run: bun run test
      - run: bun run check:role-perms-drift
      - run: bun run scripts/generate-permissions-doc.ts --check
