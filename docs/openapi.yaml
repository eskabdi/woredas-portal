openapi: 3.0.3
info:
  title: Woredas Portal — Edge Function API
  version: "1.0.0"
  description: |
    INSA Enforcer Phase 5.8. This is **not** the app's whole API surface —
    the primary data API is PostgREST's own auto-generated REST layer over
    every RLS-protected table (available at `{SUPABASE_URL}/rest/v1/`,
    documented by Supabase's own tooling — introspect it directly rather
    than hand-duplicating 42 tables' worth of schema here; see
    `docs/erd.md` for the data model it exposes).

    This spec covers the six hand-written Edge Functions, which are the
    only custom server-side logic in this app (everything else is a direct
    PostgREST/RPC call from the browser — see `docs/architecture.md`).

    One PostgREST RPC is documented below despite that split:
    `verify_credential_token` (under `/rest/v1/rpc`, not `/functions/v1`)
    picked up rate limiting, a caller-dependent response shape and a new
    audit table in the F-02 hardening pass, which puts it on the same
    footing as the Edge Functions above even though it's a plain SQL/plpgsql
    function, not a Deno function.

    All six run under Supabase's service-role key and bypass RLS, so each
    independently authenticates the caller (`Authorization: Bearer <JWT>`)
    and re-checks authorization by hand — see `docs/api-security.md` for the
    categorization and rationale.

    Since INSA remediation Phase B, every error body is a FIXED string —
    no response ever carries raw database/GoTrue/exception text (the real
    error is logged server-side by `_shared/response.ts`'s `safeError()`).
    The three invite endpoints also enforce a per-caller rate limit and
    answer `429` past it.
servers:
  - url: "{SUPABASE_URL}/functions/v1"
    variables:
      SUPABASE_URL:
        default: https://your-project-ref.supabase.co
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The caller's own Supabase Auth session token. Every function derives
        identity from this token (via `auth.getUser()`); none accept an
        identity supplied any other way.
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessBody:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
      required: [success]
  responses:
    MissingAuth:
      description: No `Authorization` header was sent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Missing authorization header" }
    Unauthorized:
      description: The bearer token did not resolve to a valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Unauthorized" }
    Forbidden:
      description: Authenticated, but the caller lacks the required role/permission/status.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Forbidden" }
    MethodNotAllowed:
      description: Only `POST` (and `OPTIONS` for CORS preflight) are accepted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Method not allowed" }
    TooManyRequests:
      description: >
        Per-caller rate limit exceeded (fixed-window counter keyed by the
        verified caller user_id — see `docs/api-security.md`). Wait and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Too many requests" }
    ServerError:
      description: >
        Unexpected failure. The body is a fixed generic string; the real
        error is logged server-side only. See `docs/api-security.md`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { error: "Internal error" }
paths:
  /sign-credential:
    post:
      summary: Sign a ready-to-print credential's QR payload (ES256)
      description: >
        Private. Every field in the signed payload is read from the
        database itself, never from the request — the caller supplies only
        which credential to sign. Compare-and-swap on `qr_payload IS NULL`
        so two concurrent calls can't double-sign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId, woredaId]
              properties:
                credentialId: { type: string, format: uuid }
                woredaId: { type: string, format: uuid }
      responses:
        "200":
          description: Signed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - type: object
                    properties:
                      token: { type: string, description: "payloadB64.signatureB64" }
              example: { success: true, token: "eyJjIjoiMDEwMTIw...ZXd0.MEUCIQ..." }
        "400":
          description: Missing `credentialId`/`woredaId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Missing fields" }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "403":
          description: Not registered, not active, wrong woreda, or missing `credential.print`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Forbidden: requires credential.print" }
        "404":
          description: Credential or resident not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Credential not found" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409":
          description: Wrong status, or already signed (compare-and-swap lost the race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Credential is not ready to print" }
        "500": { $ref: "#/components/responses/ServerError" }

  /invite-tenant-user:
    post:
      summary: Invite a new staff member into a tenant (non-admin roles only)
      description: >
        Private. Caller must be an active `tenant_admin` of the target
        woreda, or `super_admin`. Cannot self-provision `tenant_admin`/`super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role, woredaId]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                role:
                  type: string
                  enum:
                    [registry_clerk, civil_registrar, finance_clerk, supervisor, auditor, viewer]
                woredaId: { type: string, format: uuid }
                department: { type: string, nullable: true }
                job_title: { type: string, nullable: true }
                reports_to_user_id: { type: string, format: uuid, nullable: true }
                signature_path: { type: string, nullable: true }
                photo_path: { type: string, nullable: true }
      responses:
        "200":
          description: Invited.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - type: object
                    properties:
                      user_id: { type: string, format: uuid }
              example: { success: true, user_id: "a1b2c3d4-0000-0000-0000-000000000000" }
        "400":
          description: Missing fields, disallowed role, invalid manager, or GoTrue/insert failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Cannot provision this role through tenant self-service." }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /invite-platform-admin:
    post:
      summary: Invite a new super_admin or tenant_admin
      description: >
        Private. Caller must be an active `super_admin`. Minting a *new*
        `super_admin` additionally requires the console permission
        `console.console_users.manage` — an explicit escalation guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                role: { type: string, enum: [super_admin, tenant_admin] }
                woredaId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Required for tenant_admin; must be omitted for super_admin."
      responses:
        "200":
          description: Invited. `warning` is non-null if the target woreda already has an active tenant_admin.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      warning: { type: string, nullable: true }
              example:
                { success: true, user_id: "a1b2c3d4-0000-0000-0000-000000000000", warning: null }
        "400":
          description: Missing/invalid fields, or GoTrue/insert failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "woredaId is required for tenant_admin role." }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "403":
          description: Not an active super_admin, or (minting a super_admin) missing console.console_users.manage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                {
                  error: "Forbidden: inviting a new super_admin requires console.console_users.manage.",
                }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /resend-platform-invite:
    post:
      summary: Resend a platform admin's invite email
      description: Private. Caller must be an active `super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                user_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Optional target check — if given, must already be a super_admin/tenant_admin row."
      responses:
        "200":
          description: Resent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessBody" }
              example: { success: true }
        "400":
          description: Missing email, target not a platform admin, or GoTrue failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "Target is not a platform admin." }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "403":
          description: Not an active super_admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                { error: "Forbidden: only an active super_admin can resend platform invites." }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /activate-invited-user:
    post:
      summary: Flip the caller's own pending account to active
      description: >
        Private, self-scoped. Called right after `set-password.tsx` sets a
        new password. Resolves identity from the caller's own JWT only —
        never a request body — and only ever touches that same row, only
        while `status = 'pending'`. Suspended/inactive rows are left
        untouched by design (reactivating those stays an administrator
        action). Takes no request body beyond the `Authorization` header.
      requestBody:
        required: false
      responses:
        "200":
          description: Already resolved, or just activated — either way the true current status is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - type: object
                    properties:
                      status: { type: string, enum: [active, inactive, suspended] }
              example: { success: true, status: "active" }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "404":
          description: No `app_user` row for this caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "No app_user profile found" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /record-login:
    post:
      summary: Record the caller's own last-login timestamp
      description: >
        Private, self-scoped. Called right after a successful
        `signInWithPassword()` — deliberately not from the ambient
        `onAuthStateChange` listener, which also fires on tab-visibility
        session recovery. Writes only `last_login_at` on the caller's own
        row (resolved from their own JWT). No `audit_log` entry — a row per
        login would be pure noise. Takes no request body beyond the
        `Authorization` header.
      requestBody:
        required: false
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessBody" }
              example: { success: true }
        "401": { $ref: "#/components/responses/MissingAuth" }
        "404":
          description: No `app_user` row for this caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example: { error: "No app_user profile found" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /rpc/verify_credential_token:
    servers:
      - url: "{SUPABASE_URL}/rest/v1"
        variables:
          SUPABASE_URL:
            default: https://your-project-ref.supabase.co
    post:
      summary: Public + staff verification of a residence ID card (F-02 hardened)
      description: >
        Backs the public `/v/<token>` page and the in-portal
        `HararildScanner` verify tool. Anonymous callers must pass the
        signed QR payload itself (`residence_credential.qr_payload` --
        the same value already embedded in the card's QR code, ~2^60
        entropy, same order as `verify_service_letter`/`verify_receipt`'s
        own random tokens). A bare credential number only matches for an
        authenticated, active staff session (`is_active_app_user()`) --
        an anonymous caller supplying one gets no match, not the record.

        Rate limited on the anonymous path only (30 requests/60s per
        client IP, `rate_limit_hit()` -- reuses `rate_limit_bucket`, the
        same table the invite Edge Functions use). Fails OPEN on a
        limiter malfunction, same policy as every other limiter in this
        app. An authenticated staff session is not rate limited here --
        it's a normal part of their job and already has its own session
        audit trail.

        For an anonymous caller, `status` collapses `expired`,
        `suspended`, `revoked` and `replaced` to a single `"invalid"` --
        a stranger learns THAT a card isn't currently valid, not WHY.
        Staff sessions get the real value. `photo_path` and
        `date_of_birth` are likewise staff-only, unchanged from before
        this hardening pass.

        Every attempt is recorded in `credential_verification_log`
        (tenant-scoped, RLS -- `is_super_admin()` or same-woreda staff
        can read it), written from inside this function so the
        anonymous path logs too. The one exception: a rate-limited
        rejection is NOT durably logged -- `RAISE EXCEPTION` aborts the
        whole transaction PostgREST wraps this call in, which would
        also roll back that row (and this call's own rate-limit bucket
        increment) -- logging it durably would need an autonomous
        transaction this project doesn't run anywhere. The rejection
        itself is unaffected by this: every call past the limit is
        still correctly blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: >
                    The signed QR payload (anonymous callers) or a bare
                    13-digit credential number with no hyphens
                    (authenticated staff callers only).
              example: { _token: "eyJjIjoiMDQxMTI2...M3xweOegXSr8Zg" }
      responses:
        "200":
          description: >
            Always 200 with a JSON array -- empty when nothing matched
            (never a 404; a nonexistent token must not read differently
            from a real one that was rejected for some other reason).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    credential_number: { type: string }
                    status:
                      type: string
                      description: >
                        Real status for staff; "invalid" for an
                        anonymous caller when the real value is
                        expired/suspended/revoked/replaced.
                    issue_date: { type: string, format: date }
                    expiry_date: { type: string, format: date }
                    resident_full_name: { type: string }
                    woreda_name_am: { type: string }
                    woreda_name_en: { type: string }
                    kebele_name_am: { type: string }
                    kebele_name_en: { type: string }
                    photo_path:
                      { type: string, nullable: true, description: "Staff-only; null for anon" }
                    date_of_birth:
                      {
                        type: string,
                        format: date,
                        nullable: true,
                        description: "Staff-only; null for anon",
                      }
              examples:
                found:
                  value:
                    [
                      {
                        "credential_number": "04-11-26-000005-3",
                        "status": "active",
                        "issue_date": "2026-09-08",
                        "expiry_date": "2027-09-08",
                        "resident_full_name": "Sultan Sani Mohammed",
                        "woreda_name_am": "አቦከር",
                        "woreda_name_en": "Aboker",
                        "kebele_name_am": "ቀበሔ 11",
                        "kebele_name_en": "Kebele 11",
                        "photo_path": null,
                        "date_of_birth": null,
                      },
                    ]
                notFound: { value: [] }
        "500":
          description: >
            Rate limit exceeded (anonymous path only) -- surfaces as a
            plain Postgres error via PostgREST, message "Too many
            requests". Not a real 429; this RPC has no per-status error
            mapping the way the Edge Functions above do.
          content:
            application/json:
              example: { message: "Too many requests" }
