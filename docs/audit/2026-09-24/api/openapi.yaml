      operationId: activateInvitedUser
      summary: Flip the caller's own app_user from pending to active.
      x-classification: Private (self-scoped)
      x-source: supabase/functions/activate-invited-user/index.ts:17-101
      x-client-caller: src/routes/set-password.tsx:128
      x-authz: "getUser; identity from JWT only; UPDATE ... WHERE user_id = caller AND status = 'pending' (:71-76). Does not verify that a password was actually set."
      x-rate-limit: none
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, description: "Ignored" }
      responses:
        "200":
          description: Activated, or no-op with current status.
