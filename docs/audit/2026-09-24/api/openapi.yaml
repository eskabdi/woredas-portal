  # ---------------------------------------------------------------- Public RPCs
  /rest/v1/rpc/verify_credential_token:
    post:
      tags: [public-rpc]
      operationId: verifyCredentialToken
      summary: Public / staff verification of a residence ID card.
      x-classification: Public
      x-source: supabase/migrations/00000000000034_task3_harden_credential_verification.sql:145-305
      x-client-caller: "src/routes/v.$token.tsx; src/components/verification/HararildScanner.tsx"
      x-authz: "SECURITY DEFINER; anon matches only on qr_payload; bare 13-digit number only for active staff of same woreda or super_admin."
      x-rate-limit: "anon only: 30 per 60 s keyed on cf-connecting-ip / x-real-ip / XFF first hop, fail-open; rejection is RAISE 53000 -> HTTP 503 (not 429)"
      security:
        - apikey: []
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_token]
              properties:
                _token: { type: string, description: "qr_payload (anon) or 13-digit credential number (staff)" }
      responses:
        "200":
          description: Array with 0 or 1 row. For anon, status collapses expired/suspended/revoked/replaced to 'invalid' and photo_path/date_of_birth are null.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
