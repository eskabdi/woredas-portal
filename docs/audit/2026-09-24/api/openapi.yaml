openapi: 3.1.0
info:
  title: woredas-portal API surface (AS-IS, audit 2026-09-24)
  version: "as-is-9950f16"
  summary: Reverse-engineered, as-built description of every custom server-side endpoint plus the key PostgREST resources.
  description: |
    Produced by the audit-api-edge auditor from repository HEAD 9950f16e426eedd586c6fd85f6c328d9923542d1.
    It describes what the code DOES, not what the project documentation says it does. Where the two differ,
    the difference is recorded in docs/audit/2026-09-24/findings/api-edge.json (drift[]).

    Surface (full list in docs/audit/2026-09-24/api/endpoint-inventory.json):
      - 8 Supabase Edge Functions under /functions/v1 (all POST + OPTIONS; all run with the service-role key and re-check authorization by hand).
      - 3 anonymous (Public) RPCs under /rest/v1/rpc: verify_credential_token, verify_service_letter, verify_receipt.
      - 25 Private RPCs with a client caller, 26 further RPCs that are EXECUTE-able by `authenticated` (and 7 of them by `anon`, modelled)
        but have no client caller ("Internal, exposed"), and 10 functions correctly closed to both roles.
      - 66 tables and 17 security_invoker views exposed by PostgREST under /rest/v1/<name>; all RLS-protected; 21 tables have no client use.
      - Supabase Auth (/auth/v1) and Storage (/storage/v1) are platform services and are only referenced, not specified.

    Conventions used in this spec:
      - `x-classification`: Public | Private | Private (self-scoped) | Internal (INSA E-04). None of these classifications exist as code comments in the repository.
      - `x-authz`: the authorization check the code actually performs, with file:line.
      - `x-verify-jwt`: gateway JWT verification. supabase/config.toml has no [functions.*] block and scripts/deploy-functions.sh passes no
        --no-verify-jwt flag, so the repository deploy path yields verify_jwt=true (CLI default). docs/security-hardening.md:41 and the
        CLAUDE.md single-file fallback (verify_jwt:false) say otherwise. Live value: Needs-live-verification.
      - Error shapes: Edge Functions return `{"error": "<fixed string>"}`. PostgREST returns `{"code","details","hint","message"}` with the HTTP status
        derived from SQLSTATE (42501 -> 401 anon / 403 authenticated; 22xxx/23xxx/P0xxx -> 400; 53xxx -> 503; missing function -> 404 PGRST202).
        No endpoint emits 422 and only the Edge Functions' own limiter emits 429.
  contact:
    name: audit-api-edge (woredas-portal audit 2026-09-24)
servers:
  - url: https://{projectRef}.supabase.co
    description: Supabase project (ref intentionally not recorded here)
    variables:
      projectRef:
        default: "<project-ref>"
tags:
  - name: edge-functions
    description: Hand-written Deno functions (supabase/functions/*). Service-role, bypass RLS.
  - name: public-rpc
    description: Anonymous verification RPCs backing /v/$token, /verify/letter/$token, /verify/receipt/$token.
  - name: private-rpc
    description: Authenticated RPCs with a client caller in src/.
  - name: internal-rpc-exposed
    description: Helper functions that are callable via /rest/v1/rpc by authenticated (some by anon) but have no client caller.
  - name: postgrest-resources
    description: Key RLS-protected tables/views. Row shape = src/integrations/supabase/types.ts (generated) -> Tables[<name>]['Row'].
security:
  - apikey: []
    bearerAuth: []

paths:
  # ---------------------------------------------------------------- Edge Functions
  /functions/v1/sign-credential:
    post:
      tags: [edge-functions]
      operationId: signCredential
      summary: ES256-sign a ready_to_print residence credential and store qr_payload (compare-and-swap).
      x-classification: Private
      x-source: supabase/functions/sign-credential/index.ts:63-285
      x-client-caller: src/utils/harariCredentialCrypto.ts:90
      x-verify-jwt: "true per repo deploy path; Needs-live-verification"
      x-authz: >
        admin.auth.getUser(jwt) (:89) -> app_user row must exist (:112) and be active (:116) -> body.woredaId must equal caller woreda
        unless super_admin (:117) -> user_has_perm('credential.print') via caller JWT unless super_admin (:120-127) ->
        credential.woreda_id must equal body.woredaId (:146). super_admin is never checked against any console permission.
      x-rate-limit: none
      x-notes:
        - "HARARI_EC_PRIVATE_KEY presence is checked BEFORE authentication (:72) - an unauthenticated caller can learn whether the key is configured."
        - "Malformed JSON body falls through to the catch-all 500 'Credential signing failed' (:283), not 400."
        - "audit_log insert result is not checked (:270-279)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialId, woredaId]
              properties:
                credentialId: { type: string, format: uuid }
                woredaId: { type: string, format: uuid, description: "Client-supplied; cross-checked, not trusted." }
              additionalProperties: true
      responses:
        "200":
          description: Signed and stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, token]
                properties:
                  success: { const: true }
                  token: { type: string, description: "base64url(JSON compact payload) + '.' + base64url(raw 64-byte ECDSA P-256 signature)" }
        "400": { $ref: "#/components/responses/EdgeBadRequest" }
        "401": { $ref: "#/components/responses/EdgeUnauthorized" }
        "403": { $ref: "#/components/responses/EdgeForbidden" }
        "404": { $ref: "#/components/responses/EdgeNotFound" }
        "405": { $ref: "#/components/responses/EdgeMethodNotAllowed" }
        "409": { $ref: "#/components/responses/EdgeConflict" }
        "500": { $ref: "#/components/responses/EdgeServerError" }
    options:
      tags: [edge-functions]
      operationId: signCredentialPreflight
      summary: CORS preflight (identical for all 8 functions).
      x-classification: Public
      security: []
      x-source: supabase/functions/_shared/response.ts:93-101
      responses:
        "200":
          description: >
            Always 200. Access-Control-Allow-Origin echoes the request Origin only when it is SITE_URL or http://localhost:5173
            (response.ts:87-91), otherwise it is the empty string. Allow-Methods "POST, OPTIONS"; no Allow-Credentials.
          headers:
            Access-Control-Allow-Origin: { schema: { type: string } }
            Access-Control-Allow-Headers: { schema: { type: string, const: "authorization, x-client-info, apikey, content-type" } }
            Access-Control-Allow-Methods: { schema: { type: string, const: "POST, OPTIONS" } }
            Vary: { schema: { type: string, const: Origin } }

  /functions/v1/invite-tenant-user:
    post:
      tags: [edge-functions]
      operationId: inviteTenantUser
      summary: Invite a staff member into a woreda (six staff roles only).
      x-classification: Private
      x-source: supabase/functions/invite-tenant-user/index.ts:29-260
      x-client-caller: src/components/settings/UsersRolesTab.tsx:787
      x-verify-jwt: "true per repo deploy path; Needs-live-verification"
      x-authz: >
        userClient.auth.getUser() (:53) -> caller app_user active (:88) -> tenant_admin of body.woredaId OR super_admin (:91-93).
        No console-permission check for a super_admin caller. Role allow-list (:20-27) excludes print_officer and custom.
      x-rate-limit: "20 per 600 s keyed invite-tenant-user:<caller user_id>, fail-open (:99)"
      x-notes:
        - "No schema validation: email format, string types and lengths of full_name/department/job_title, and signature_path/photo_path (arbitrary storage paths) are not validated."
        - "username = email local part (:134); app_user.username is UNIQUE (baseline.sql:536) so two different domains with the same local part collide AFTER the invite email was sent."
        - "Email address is written into audit_log.new_value_json (:213, :252)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role, woredaId]
              properties:
                email: { type: string, description: "Not validated server-side beyond truthiness" }
                full_name: { type: string }
                role: { type: string, enum: [registry_clerk, civil_registrar, finance_clerk, supervisor, auditor, viewer] }
                woredaId: { type: string, format: uuid }
                department: { type: [string, "null"] }
                job_title: { type: [string, "null"] }
                reports_to_user_id: { type: [string, "null"], format: uuid, description: "Must be an app_user of woredaId (:102-110)" }
                signature_path: { type: [string, "null"], description: "Stored verbatim; no prefix/bucket validation" }
                photo_path: { type: [string, "null"], description: "Stored verbatim; no prefix/bucket validation" }
      responses:
        "200":
          description: Invited (or pending invite in same woreda refreshed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  user_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/EdgeBadRequest" }
        "401": { $ref: "#/components/responses/EdgeUnauthorized" }
        "403": { $ref: "#/components/responses/EdgeForbidden" }
        "405": { $ref: "#/components/responses/EdgeMethodNotAllowed" }
        "429": { $ref: "#/components/responses/EdgeTooManyRequests" }
        "500": { $ref: "#/components/responses/EdgeServerError" }

  /functions/v1/invite-platform-admin:
    post:
      tags: [edge-functions]
      operationId: invitePlatformAdmin
      summary: Invite a super_admin or tenant_admin.
      x-classification: Private
      x-source: supabase/functions/invite-platform-admin/index.ts:15-237
      x-client-caller: "src/components/admin/PlatformUsersTab.tsx:679; src/routes/admin.tenants.$woredaId.provision.tsx:166"
