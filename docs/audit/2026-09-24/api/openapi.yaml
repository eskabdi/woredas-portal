        getUser (:39) -> caller must be active super_admin (:70) -> console.console_users.manage ONLY when role=super_admin (:84-94).
        Minting a tenant_admin for any woreda requires no console permission (console.users.manage / console.tenants.manage are not checked anywhere server-side).
      x-rate-limit: "10 per 600 s keyed invite-platform-admin:<caller>, fail-open (:99)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              properties:
                email: { type: string }
                full_name: { type: string }
                role: { type: string, enum: [super_admin, tenant_admin] }
                woredaId: { type: [string, "null"], format: uuid, description: "Required for tenant_admin; must be absent for super_admin" }
      responses:
        "200":
          description: Invited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  user_id: { type: string, format: uuid }
                  warning: { type: [string, "null"], description: "Contains the existing tenant admin's full_name when one exists (:113)" }
        "400": { $ref: "#/components/responses/EdgeBadRequest" }
        "401": { $ref: "#/components/responses/EdgeUnauthorized" }
        "403": { $ref: "#/components/responses/EdgeForbidden" }
        "405": { $ref: "#/components/responses/EdgeMethodNotAllowed" }
        "429": { $ref: "#/components/responses/EdgeTooManyRequests" }
        "500": { $ref: "#/components/responses/EdgeServerError" }

  /functions/v1/resend-platform-invite:
