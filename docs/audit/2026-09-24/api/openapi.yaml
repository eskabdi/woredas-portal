      x-client-caller: src/components/admin/PlatformUsersTab.tsx:307
      x-authz: "getUser -> active super_admin (:46). No console-permission check. Target must be super_admin/tenant_admin (:63-65); target status not checked."
      x-rate-limit: "10 per 600 s, fail-open (:54)"
      x-notes:
        - "Request body is {user_id} only. docs/openapi.yaml:282 documents a required `email` field that the code never reads."
        - "audit_log row carries the target e-mail and no woreda_id (:105-112)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/EdgeSuccess" }
        "400": { $ref: "#/components/responses/EdgeBadRequest" }
        "401": { $ref: "#/components/responses/EdgeUnauthorized" }
        "403": { $ref: "#/components/responses/EdgeForbidden" }
        "405": { $ref: "#/components/responses/EdgeMethodNotAllowed" }
        "429": { $ref: "#/components/responses/EdgeTooManyRequests" }
        "500": { $ref: "#/components/responses/EdgeServerError" }

