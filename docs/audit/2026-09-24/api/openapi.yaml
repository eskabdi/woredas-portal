components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: >
        Supabase publishable (anon) key. Identifies the project; not a secret and not an authorization boundary.
        Required by the platform gateway for /rest/v1; sent by supabase-js on every call.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase Auth access token (or the anon key when no session). Edge Functions validate it server-side with
        GoTrue getUser(); PostgREST derives role + auth.uid() from it. Signing algorithm (legacy HS256 secret vs.
        asymmetric signing keys) and access-token lifetime are dashboard settings: Needs-live-verification.
  parameters:
    select: { name: select, in: query, required: false, schema: { type: string }, description: "PostgREST column/embedding selector" }
    limit: { name: limit, in: query, required: false, schema: { type: integer } }
    offset: { name: offset, in: query, required: false, schema: { type: integer } }
    order: { name: order, in: query, required: false, schema: { type: string } }
    Prefer: { name: Prefer, in: header, required: false, schema: { type: string, examples: ["return=representation", "resolution=merge-duplicates"] } }
  schemas:
    EdgeError:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "Fixed string; never raw driver text (safeError, _shared/response.ts:137-146)" }
    PostgrestError:
      type: object
      properties:
        code: { type: string, description: "SQLSTATE or PGRSTxxx" }
        details: { type: [string, "null"] }
        hint: { type: [string, "null"] }
        message: { type: string, description: "RAISE EXCEPTION text is returned verbatim" }
    Row:
      type: object
      additionalProperties: true
      description: "Row shape = src/integrations/supabase/types.ts Tables[<table>]['Row'|'Insert'|'Update'] (generated, matches migrations column-for-column per WP-DB replay)."
    VerifyCredentialRow:
      type: object
      properties:
        credential_number: { type: string }
        status: { type: string }
        issue_date: { type: [string, "null"], format: date }
        expiry_date: { type: [string, "null"], format: date }
        resident_full_name: { type: [string, "null"] }
        woreda_name_am: { type: [string, "null"] }
        woreda_name_en: { type: [string, "null"] }
        kebele_name_am: { type: [string, "null"] }
        kebele_name_en: { type: [string, "null"] }
        photo_path: { type: [string, "null"], description: "staff only" }
        date_of_birth: { type: [string, "null"], format: date, description: "staff only" }
    VerifyLetterRow:
      type: object
      properties:
        request_number: { type: string }
        issued_at: { type: string, format: date-time }
        subject: { type: [string, "null"] }
        resident_full_name: { type: [string, "null"] }
        letter_summary: { type: [string, "null"] }
        service_type_am: { type: [string, "null"] }
        service_type_en: { type: [string, "null"] }
        woreda_name_am: { type: [string, "null"] }
        woreda_name_en: { type: [string, "null"] }
        kebele_name_am: { type: [string, "null"] }
        kebele_name_en: { type: [string, "null"] }
    VerifyReceiptRow:
      type: object
      properties:
        receipt_number: { type: string }
        receipt_date: { type: string, format: date }
        total_amount: { type: number }
        payment_type: { type: string }
        channel: { type: [string, "null"] }
        printed_at: { type: [string, "null"], format: date-time }
        paid_by_full_name: { type: [string, "null"] }
        paid_by_full_name_am: { type: [string, "null"] }
        woreda_name_am: { type: [string, "null"] }
        woreda_name_en: { type: [string, "null"] }
        kebele_name_am: { type: [string, "null"] }
        kebele_name_en: { type: [string, "null"] }
  responses:
    EdgeSuccess:
      description: OK
      content: { application/json: { schema: { type: object, properties: { success: { const: true } } } } }
    EdgeBadRequest:
      description: Missing/invalid field or a business-rule rejection (see samples). Duplicate e-mail is also 400, never 409.
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeUnauthorized:
      description: "No Authorization header, or GoTrue getUser() rejected the token. If gateway verify_jwt=true, an invalid JWT is rejected by the platform before the function runs (body shape is platform-defined)."
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeForbidden:
      description: Authenticated but wrong role, status, woreda or permission.
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeNotFound:
      description: Target row not found (cross-tenant and non-existent are deliberately indistinguishable where the code folds the woreda filter into the query).
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeConflict:
      description: State conflict (sign-credential only).
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeMethodNotAllowed:
      description: Any method other than POST/OPTIONS.
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeTooManyRequests:
      description: Per-caller fixed-window limit exceeded (fails open if the limiter errors).
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    EdgeServerError:
      description: Fixed generic string; details only in function logs. Also returned for a malformed JSON body.
      content: { application/json: { schema: { $ref: "#/components/schemas/EdgeError" } } }
    PgrstRows:
      description: Rows visible under RLS (possibly empty).
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Row" } } } }
    PgrstBadRequest:
      description: "RAISE EXCEPTION with 22xxx/23xxx/P0xxx SQLSTATE (message returned verbatim)."
      content: { application/json: { schema: { $ref: "#/components/schemas/PostgrestError" } } }
    PgrstForbidden:
      description: "SQLSTATE 42501 insufficient_privilege from an in-function permission check, or RLS WITH CHECK violation."
      content: { application/json: { schema: { $ref: "#/components/schemas/PostgrestError" } } }
    PgrstFunctionNotFound:
      description: "PGRST202 - function/argument names not in schema cache (e.g. the removed _credential_digits parameter)."
      content: { application/json: { schema: { $ref: "#/components/schemas/PostgrestError" } } }
    PgrstRateLimited:
      description: "verify_credential_token anon limiter: RAISE 'Too many requests' USING ERRCODE insufficient_resources (53000) -> HTTP 503."
      content: { application/json: { schema: { $ref: "#/components/schemas/PostgrestError" } } }
    PlatformNoApiKey:
      description: "Platform gateway rejects a /rest/v1 request without the apikey header. Body shape is platform-defined (Needs-live-verification)."
    PgrstError:
      description: Any PostgREST error.
      content: { application/json: { schema: { $ref: "#/components/schemas/PostgrestError" } } }
